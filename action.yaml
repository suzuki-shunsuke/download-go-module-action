name: Download Go modules
description: Download Go modules and upload them as artifacts
author: Shunsuke Suzuki
inputs:
  aqua_version:
    description: aqua version (v2.64.0 or later). Required if aqua_packages is set
    required: false
  aqua_packages:
    description: aqua go_install packages to be installed
    required: false
  go-version-file:
    description: Go version file path (go.mod)
    required: false
    default: go.mod
  artifact_name:
    description: GitHub artifact name
    required: false
    default: gomodule
  takumi_guard_bot_id:
    description: Takumi Guard Bot id
    required: false
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{inputs.go-version-file}}
        cache: false

    - name: Set up Takumi Guard
      uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
      with:
        bot-id: ${{inputs.takumi_guard_bot_id}}

    - name: Install go-install packages with aqua
      if: inputs.aqua_packages != ''
      uses: $/actions/install
      with:
        aqua_version: ${{inputs.aqua_version}}
        packages: ${{inputs.aqua_packages}}

    - name: Download Go modules
      shell: bash
      run: go mod download all

    - name: Archive Go modules
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gomodule"
        tar -C "$(go env GOMODCACHE)" -czf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz" cache/download

    - name: Archive go-install packages
      if: inputs.aqua_packages != ''
      shell: bash
      run: |
        tar -C "$(aqua root-dir)" -czf "$RUNNER_TEMP/gomodule/go_install.tar.gz" pkgs/go_install

    - name: Upload Go modules and go-install packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{inputs.artifact_name}}
        path: ${{ runner.temp }}/gomodule
        retention-days: 1
