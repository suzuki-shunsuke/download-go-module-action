name: Download Go modules
description: Download Go modules and upload them as artifacts
author: Shunsuke Suzuki
inputs:
  aqua_version:
    description: aqua version (v2.64.0 or later). Required if aqua_packages is set
    required: false
  aqua_packages:
    description: aqua go_install packages to be installed
    required: false
  go-version-file:
    description: Go version file path (go.mod)
    required: false
    default: go.mod
  artifact_name:
    description: GitHub artifact name
    required: false
    default: gomodule
  takumi_guard_bot_id:
    description: Takumi Guard Bot id
    required: false
  go_mod_tidy:
    description: |
      If this is true, Go modules are downloaded by `go mod tidy -e` instead of `go mod download`.
      Set this if the job restoring the modules runs `go mod tidy`,
      because go mod tidy also requires modules imported by tests of dependencies, which go mod download doesn't download.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{inputs.go-version-file}}
        cache: false

    - name: Set up Takumi Guard
      uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
      with:
        bot-id: ${{inputs.takumi_guard_bot_id}}

    - name: Install aqua
      if: inputs.aqua_packages != ''
      uses: $/install
      with:
        aqua_version: ${{inputs.aqua_version}}
        # go_install packages are installed in the next step in parallel with go mod download
        enable_aqua_install: "false"

    # go mod download is mostly network-bound while installing go_install packages is mostly CPU-bound,
    # so running them in parallel shortens the job.
    - name: Download Go modules and install go_install packages with aqua
      shell: bash
      env:
        PKGS: ${{inputs.aqua_packages}}
        GO_MOD_TIDY: ${{inputs.go_mod_tidy}}
        GITHUB_TOKEN: ${{github.token}}
      run: |
        set -u
        aqua_pid=
        aqua_log=

        # Stop background processes and show the log of aqua i even if the step is cancelled or times out.
        on_exit() {
          if [ -n "$aqua_pid" ] && kill -0 "$aqua_pid" 2>/dev/null; then
            echo "[WARN] stopping aqua i" >&2
            pkill -TERM -P "$aqua_pid" 2>/dev/null || :
            kill -TERM "$aqua_pid" 2>/dev/null || :
          fi
          if [ -n "${go_pid:-}" ] && kill -0 "$go_pid" 2>/dev/null; then
            kill -TERM "$go_pid" 2>/dev/null || :
          fi
          if [ -n "$aqua_log" ] && [ -f "$aqua_log" ]; then
            echo "::group::aqua i"
            cat "$aqua_log"
            echo "::endgroup::"
          fi
        }
        trap on_exit EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM

        if [ -n "$PKGS" ]; then
          set -f
          pkgs=()
          while IFS= read -r line; do
            line=${line%%#*}
            pkgs+=($line)
          done <<< "$PKGS"
          set +f
          aqua_log="$RUNNER_TEMP/download-go-module-action-aqua.log"
          # Use a dedicated GOMODCACHE so that modules of go_install packages aren't included in the artifact.
          # -modcacherw allows the runner to remove it.
          (
            start=$SECONDS
            code=0
            GOMODCACHE="$RUNNER_TEMP/download-go-module-action-aqua-gomodcache" \
              GOFLAGS="${GOFLAGS:+$GOFLAGS }-modcacherw" \
              aqua i -a -- ${pkgs[@]+"${pkgs[@]}"} || code=$?
            echo "[INFO] aqua i took $((SECONDS - start))s" >&2
            exit "$code"
          ) > "$aqua_log" 2>&1 &
          aqua_pid=$!
        fi

        # go mod tidy doesn't run code of modules, so it is safe to run it in this job.
        # -e makes go mod tidy download modules as many as possible even if the code has errors.
        # Changes of go.mod and go.sum by go mod tidy aren't uploaded.
        go_cmd=(go mod download)
        if [ "$GO_MOD_TIDY" = "true" ]; then
          go_cmd=(go mod tidy -e)
        fi

        start=$SECONDS
        go_code=0
        # Run go mod download in the background too, because bash runs traps only after the foreground command finishes,
        # while wait returns immediately when a signal arrives.
        "${go_cmd[@]}" &
        go_pid=$!
        wait "$go_pid" || go_code=$?
        go_pid=
        echo "[INFO] ${go_cmd[*]} took $((SECONDS - start))s" >&2

        aqua_code=0
        if [ -n "$aqua_pid" ]; then
          wait "$aqua_pid" || aqua_code=$?
          aqua_pid=
        fi

        if [ "$go_code" -ne 0 ]; then
          echo "::error::${go_cmd[*]} failed" >&2
        fi
        if [ "$aqua_code" -ne 0 ]; then
          echo "::error::aqua i failed" >&2
        fi
        if [ "$go_code" -ne 0 ] || [ "$aqua_code" -ne 0 ]; then
          exit 1
        fi

    - name: Archive Go modules
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gomodule"
        gomodcache=$(go env GOMODCACHE)
        # The directory doesn't exist if the module has no dependency
        mkdir -p "$gomodcache/cache/download"
        (cd "$gomodcache" && tar -czf - cache/download) > "$RUNNER_TEMP/gomodule/gomodcache.tar.gz"

    - name: Archive go_install packages
      if: inputs.aqua_packages != ''
      shell: bash
      run: |
        (cd "$(aqua root-dir)" && tar -czf - pkgs/go_install) > "$RUNNER_TEMP/gomodule/go_install.tar.gz"

    - name: Upload Go modules and go_install packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{inputs.artifact_name}}
        path: ${{ runner.temp }}/gomodule
        retention-days: 1
