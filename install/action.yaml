name: install
description: Internal action to install tools with aqua. Not intended for direct use.
inputs:
  aqua_version:
    description: aqua version (v2.64.0 or later)
    required: true
  packages:
    description: |
      command and package names to be installed.
      If this is empty, only links to packages are created, so packages extracted from the artifact can be used.
    required: false
outputs:
  aqua_config_path:
    description: The file path to aqua.yaml
    value: ${{steps.path.outputs.value}}
runs:
  using: composite
  steps:
    - shell: bash
      id: path
      run: |
        config=${GITHUB_ACTION_PATH}/aqua/aqua.yaml
        echo "AQUA_GLOBAL_CONFIG=${config}:${AQUA_GLOBAL_CONFIG:-}" >> "$GITHUB_ENV"
        echo "value=$config" >> "$GITHUB_OUTPUT"
    - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: ${{inputs.aqua_version}}
        packages: ${{inputs.packages}}
