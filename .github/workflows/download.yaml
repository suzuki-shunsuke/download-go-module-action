---
name: Download Go modules and upload them as artifacts
on:
  workflow_call:
    inputs:
      aqua_version:
        required: false
        type: string
      aqua_packages:
        required: false
        type: string
      go-version-file:
        type: string
        required: false
        default: go.mod
      artifact_name:
        required: false
        type: string
        default: gomodule
      ref:
        description: |
          The git ref to checkout. If empty, the default ref of actions/checkout is used.
          Set this when the job restoring the modules checks out a different ref (e.g. github.event.pull_request.head.sha).
        required: false
        type: string
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false

permissions: {}

env:
  AQUA_LOG_COLOR: always

jobs:
  download:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{inputs.ref}}
          persist-credentials: false

      - name: Download Go modules and upload them as artifacts
        uses: $/.
        with:
          go-version-file: ${{inputs.go-version-file}}
          takumi_guard_bot_id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
          aqua_version: ${{inputs.aqua_version}}
          aqua_packages: ${{inputs.aqua_packages}}
          artifact_name: ${{inputs.artifact_name}}
