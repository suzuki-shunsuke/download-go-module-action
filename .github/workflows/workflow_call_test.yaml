---
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
jobs:
  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@51ece8dcaabff59820bfb2053c56e3cb281cf7b2 # v0.0.1
    with:
      aqua_version: v2.64.0
    permissions:
      pull-requests: read
      contents: read

  gomodule:
    uses: $/.github/workflows/download.yaml
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.64.0
      aqua_packages: go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  gotest:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    permissions: {}
    env:
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and go_install packages (go-licenses)
        uses: $/restore
        with:
          aqua_version: v2.64.0

      - name: go test
        run: go test -v ./... -race -covermode=atomic

      - name: Validate Go license
        run: go-licenses check --disallowed_types=forbidden,restricted,unknown ./...

  # go_install packages are built on Linux, so only Go modules are tested on Windows
  restore-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    needs: gomodule
    permissions: {}
    env:
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: $/restore

      - name: go build
        run: go build ./...
