---
permissions: {}
on:
  workflow_call:
    secrets:
      TAKUMI_GUARD_BOT_ID:
        required: false
jobs:
  test:
    uses: suzuki-shunsuke/test-workflow/.github/workflows/test.yaml@0b89b9b4314282810bc944364380568708208eaa # v0.0.2
    with:
      aqua_version: v2.65.2
    permissions:
      pull-requests: read
      contents: read

  gomodule:
    uses: $/.github/workflows/download.yaml
    permissions:
      contents: read
      id-token: write
    with:
      aqua_version: v2.65.2
      aqua_packages: go-licenses
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  # Test the case where no go_install package is installed and the Go module has no dependency.
  # GOMODCACHE isn't created by go mod download in this case.
  gomodule-without-packages:
    uses: $/.github/workflows/download.yaml
    permissions:
      contents: read
      id-token: write
    with:
      artifact_name: gomodule-without-packages
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  # Test go_mod_tidy
  gomodule-tidy:
    uses: $/.github/workflows/download.yaml
    permissions:
      contents: read
      id-token: write
    with:
      artifact_name: gomodule-tidy
      go_mod_tidy: true
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}

  restore-tidy:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule-tidy
    permissions: {}
    env:
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: $/restore
        with:
          artifact_name: gomodule-tidy

      - name: go mod tidy
        run: go mod tidy

  restore-without-packages:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule-without-packages
    permissions: {}
    env:
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: $/restore
        with:
          artifact_name: gomodule-without-packages

      - name: go mod tidy
        run: go mod tidy

      - name: go build
        run: go build ./...

  gotest:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: gomodule
    permissions: {}
    env:
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules and go_install packages (go-licenses)
        uses: $/restore
        with:
          aqua_version: v2.65.2

      - name: go test
        run: go test -v ./... -race -covermode=atomic

      - name: Validate Go license
        run: go-licenses check --disallowed_types=forbidden,restricted,unknown ./...

  # go_install packages are built on Linux, so only Go modules are tested on Windows
  restore-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    needs: gomodule
    permissions: {}
    env:
      GOPROXY: "off"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go modules
        uses: $/restore

      - name: go build
        run: go build ./...
