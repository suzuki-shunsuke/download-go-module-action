name: restore
description: Restore Go modules and go_install packages from GitHub artifacts
inputs:
  aqua_version:
    description: |
      aqua version (v2.64.0 or later)
      This is required only when using go_install packages.
    required: false
  artifact_name:
    description: GitHub artifact name
    required: false
    default: gomodule
runs:
  using: composite
  steps:
    - name: Download Go modules and go_install packages (go-licenses)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{inputs.artifact_name}}
        path: ${{ runner.temp }}/gomodule

    - name: Extract Go modules
      shell: bash
      run: |
        gomodcache=$(go env GOMODCACHE)
        mkdir -p "$gomodcache"
        tar -C "$gomodcache" -xzf "$RUNNER_TEMP/gomodule/gomodcache.tar.gz"

    - name: Install go-licenses
      if: inputs.aqua_version != ''
      uses: $/install
      with:
        aqua_version: ${{inputs.aqua_version}}

    - name: Extract Go install packages (go-licenses)
      if: inputs.aqua_version != ''
      shell: bash
      run: |
        root_dir=$(aqua root-dir)
        mkdir -p "$root_dir"
        tar -C "$root_dir" -xzf "$RUNNER_TEMP/gomodule/go_install.tar.gz"
